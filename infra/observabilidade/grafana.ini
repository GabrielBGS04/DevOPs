[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://127.0.0.1:3000/
[security]
disable_initial_admin_creation = true
[auth]
disable_login_form = true
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
[analytics]
reporting_enabled = false
check_for_updates = false
[users]
viewers_can_edit = false
