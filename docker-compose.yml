services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devops_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
      B1_IA_URL: http://ia:8001
      B1_NOTIFICACOES_URL: http://integracoes:8002
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:1.28.3-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  ia:
    image: b1-ia:${B1_IMAGE_TAG:-local}
    build: ./services/ia

  integracoes:
    image: b1-integracoes:${B1_IMAGE_TAG:-local}
    build: ./services/integracoes
    environment:
      B1_MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      CORE_BASE_URL: http://app:8080
    depends_on:
      - mqtt
    volumes:
      - integracoes_data:/data

  mqtt:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./infra/mqtt/mosquitto.container.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data

volumes:
  postgres_data:
  integracoes_data:
  mqtt_data:
